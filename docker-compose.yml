services:
  db-pedidos:
    image: postgres:18-alpine
    container_name: pedidos360-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pedidos360_db
      POSTGRES_USER: pedidos360
      POSTGRES_PASSWORD: pedidos360
    ports:
      - "5432:5432"
    volumes:
      - pedidos360_pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos360 -d pedidos360_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pedidos360-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pedidos360.com
      PGADMIN_DEFAULT_PASSWORD: pedidos360
    ports:
      - "5050:80"
    depends_on:
      - db-pedidos

  inventario:
    build: ./inventario-service
    container_name: pedidos360-inventario
    restart: unless-stopped
    depends_on:
      db-pedidos:
        condition: service_healthy
    environment:
      # Dentro de la red de Docker, la base no se llama "localhost" sino
      # como el servicio de arriba: "db-pedidos".
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-pedidos:5432/pedidos360_db
    ports:
      - "8081:8081"

  pedidos:
    build: ./pedidos-service
    container_name: pedidos360-pedidos
    restart: unless-stopped
    depends_on:
      db-pedidos:
        condition: service_healthy
      inventario:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-pedidos:5432/pedidos360_db
      # Mismo caso: pedidos-service le habla a inventario por el nombre
      # del servicio, no por localhost:8081.
      INVENTARIO_SERVICE_URL: http://inventario:8081
    ports:
      - "8082:8082"

volumes:
  pedidos360_pgdata:

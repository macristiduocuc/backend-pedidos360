spring.application.name=inventario-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/pedidos360_db
spring.datasource.username=pedidos360
spring.datasource.password=pedidos360

# "validate": las tablas ya existen (las creamos con 01_schema.sql).
# Hibernate solo revisa que las entidades calcen con el esquema real,
# nunca crea ni borra columnas por su cuenta.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Seguridad: valida el JWT emitido por Azure AD (login corporativo del frontend).
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/93cc35f5-cb03-4022-ad90-77cbe1ca3267/v2.0
pedidos360.security.audience=0f50a8bc-f7a7-4dde-9e44-9f05fb077cc0

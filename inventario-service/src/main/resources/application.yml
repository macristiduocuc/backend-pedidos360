spring:
  application:
    name: inventario-service

  datasource:
    url: jdbc:postgresql://localhost:5432/pedidos360_db
    username: pedidos360
    password: pedidos360

  # "validate": las tablas ya existen (las creamos con los scripts de db/init).
  # Hibernate solo revisa que las entidades calcen con el esquema real,
  # nunca crea ni borra columnas por su cuenta.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Seguridad: valida el JWT emitido por Azure AD (login corporativo del frontend).
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/93cc35f5-cb03-4022-ad90-77cbe1ca3267/v2.0

  # Conexión a RabbitMQ. En Docker, SPRING_RABBITMQ_ADDRESSES / _USERNAME / _PASSWORD
  # (definidos en docker-compose.yml) reemplazan estos valores.
  rabbitmq:
    addresses: localhost:5672
    # Si RabbitMQ no responde, el intento de conexión se abandona rápido para que
    # reservar stock no se quede esperando al broker.
    connection-timeout: 3s
    listener:
      simple:
        # ACK manual: cada consumidor confirma (ack) o rechaza (nack) cada mensaje explícitamente.
        acknowledge-mode: manual
        # Un mensaje a la vez por consumidor: si falla, no se arrastran otros mensajes sin confirmar.
        prefetch: 1

server:
  port: 8081

pedidos360:
  security:
    audience: 0f50a8bc-f7a7-4dde-9e44-9f05fb077cc0

app:
  inventario:
    # Un producto tiene "poco stock" cuando le quedan MENOS unidades que este valor
    # (es el mismo criterio que usa el panel de Auditoría).
    umbral-stock-bajo: 10

  # -------------------------------------------------------------------------
  # MENSAJERÍA (RabbitMQ): único lugar donde se definen los nombres de exchanges,
  # colas, DLQ, bindings y routing keys. Ninguna clase Java tiene nombres escritos.
  # -------------------------------------------------------------------------
  mensajeria:
    exchange:
      principal: pedidos.exchange      # topic: eventos de negocio (el mismo que usa pedidos-service)
      dlx: pedidos.dlx                 # direct: mensajes que no se pudieron procesar

    # Caso de uso: reponer stock cuando se cancela un pedido
    reposicion:
      cola: inventario.reposicion.q
      dlq: inventario.reposicion.dlq
      binding: pedido.cancelado.*

    # Política de los consumidores ante errores recuperables (ej.: la base de datos no responde).
    # Después de max-intentos fallidos, el mensaje se rechaza (nack sin reencolar) y pasa a su DLQ.
    consumidor:
      max-intentos: 3
      espera-reintento: 500ms

    # Routing key que publica este servicio. {localId} se reemplaza por el id del local
    # del producto (ejemplo: stock.bajo.local3).
    routing-key:
      stock-bajo: stock.bajo.local{localId}